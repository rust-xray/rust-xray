[package]
name = "rust-xray"
version = "0.1.0"
edition = "2021"

[dependencies]
aead = "0.5.2"
aes-gcm = "0.10"
base64 = "0.22.1"
bytes = "1.7.1"
hkdf = "0.12.4"
hmac = "0.12"
rustls-pki-types = "1.8.0"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10.8"
tokio = {version = "1.40.0", features = ["full"]}
uuid = {version = "1", features = ["std", "serde"]}
tracing = "0.1.41"
tracing-subscriber = {version = "0.3.19", features = ["env-filter"]}
x25519-dalek = {version = "2.0.1", features = ["static_secrets", "getrandom"]}
zeroize = "1.8.1"
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
subtle = "2"


