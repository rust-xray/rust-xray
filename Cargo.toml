[package]
name = "rust-xray"
version = "0.1.0"
edition = "2021"
default-run = "rust-xray"

[[bin]]
name = "rust-xray"
path = "src/main.rs"

[[bin]]
name = "xray"
path = "src/bin/xray.rs"

[features]
default = []

[build-dependencies]
tonic-build = "0.12"

[dependencies]
aead = "0.5.2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22.1"
bytes = "1.7.1"
h2 = "0.4"
http = "1"
hkdf = "0.12.4"
hmac = "0.12"
ml-dsa = "0.1"
ml-kem = { version = "0.3.2", default-features = false, features = ["getrandom", "zeroize"] }
rustls-pki-types = "1.8.0"
rustls = { version = "0.23.13", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10.8"
tokio = {version = "1.40.0", features = ["full"]}
uuid = {version = "1", features = ["std", "serde", "v5"]}
tracing = "0.1.41"
tracing-subscriber = {version = "0.3.19", features = ["env-filter"]}
x25519-dalek = {version = "2.0.1", features = ["static_secrets", "getrandom"]}
zeroize = "1.8.1"
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = "0.2"
subtle = "2"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tonic-reflection = "0.12"
tokio-stream = "0.1"
tracing-appender = "0.2"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
